<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CNAV - Main Page</title> 
            <link rel="stylesheet" href="assets/css/main.css">
            <link rel="stylesheet" href="assets/css/components.css">
            <link rel="stylesheet" href="assets/css/app.css">
            <link rel="icon" type="image/png" href="assets/images/logo-cnav.png">
    </head>

    <body>
        <canvas id="bgCanvas"></canvas>
        <nav class="navbar-main reveal-top">
            <div class="logo">
                <img src="assets/images/logo-cnav.png" alt="CNAV Logo">
            </div>

            <a href="index.html" class="back-icon">
                <img src="assets/icons/back-icon.png" alt="Back">
            </a>
        </nav>

        <main class="main-container">
            <section class="left-panel reveal-left">
                <div class="box input-box">
                    <h2>Input Bilangan Kompleks</h2>
                    <div class="input-group">
                        <label>Z₁ :</label>
                        <span>Real</span>
                        <input type="number" id="real1">
                        <span>+ Imag</span>
                        <input type="number" id="imag1">
                        <span>i</span>
                    </div>

                    <div class="input-group">
                        <label>Z₂ :</label>
                        <span>Real</span>
                        <input type="number" id="real2">
                        <span>+ Imag</span>
                        <input type="number" id="imag2">
                        <span>i</span>
                    </div>

                    <div class="operation-row">
                        <label>Operasi:</label>
                        <select id="operation">
                            <option value="">Pilih</option>
                            <option value="add">Penjumlahan</option>
                            <option value="sub">Pengurangan</option>
                            <option value="mul">Perkalian</option>
                            <option value="div">Pembagian</option>
                        </select>

                        <button id="calculateBtn">
                            Hitung
                        </button>

                        <button id="resetBtn">
                            Reset
                        </button>
                    </div>
                </div>

                <div class="box step-box">
                    <h2>Langkah Penyelesaian</h2>
                    <div id="steps"></div>
                </div>
            </section>

            <section class="right-panel reveal-right">
                <div class="box graph-box">
                    <h2>Visualisasi</h2>
                <div class="graph-area">
                    <canvas id="complexCanvas"></canvas>
                    <div class="zoom-controls">
                        <button id="zoomIn">+</button>
                        <button id="zoomOut">-</button>
                        <button id="saveGraphBtn">⤓</button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="main-footer reveal-bottom">
            <p>
                Copyright © 2026 CNAV.
                All rights reserved.
            </p>
        </footer>

        <script type="module" src="assets/js/app.js"></script>
        <script src="assets/js/canvas/background.js"></script>
        <script src="assets/js/ui/app-entrance.js"></script>
    </body>
</html>
